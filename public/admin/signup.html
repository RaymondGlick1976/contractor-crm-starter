<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up your business | YourCRM</title>
  <link rel="stylesheet" href="/css/styles.css?v=40">
  <link rel="stylesheet" href="/css/auth.css?v=1">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand"><span class="auth-brand-mark">Y</span> YourCRM</div>
    <div class="auth-card">
      <h1>Set up your business</h1>
      <p class="auth-sub">One-time setup: create your business and the first admin login. Team members join by invitation afterwards.</p>

      <form id="signup-form" novalidate>
        <div class="auth-field">
          <label for="business">Business name</label>
          <input type="text" id="business" class="form-input" autocomplete="organization" placeholder="e.g. Smith Remodeling" required>
        </div>
        <div class="auth-field">
          <label for="name">Your name</label>
          <input type="text" id="name" class="form-input" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="email">Work email</label>
          <input type="email" id="email" class="form-input" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="submit-btn">Create account</button>
        <div class="auth-error" id="error"></div>
      </form>

      <div class="auth-links">Already have an account? <a href="/admin/login.html">Sign in</a></div>
    </div>
  </div>

  <script src="/js/utils.js?v=40"></script>
  <script>
    // Already set up? This page is one-time only — send people to sign in.
    fetch('/api/setup-status').then(r => r.json()).then(s => {
      if (s && s.configured) location.replace('/admin/login.html?setup=done');
    }).catch(() => {});

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const business = document.getElementById('business').value.trim();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      const btn = document.getElementById('submit-btn');
      errEl.textContent = '';

      if (!business || !name || !email || !password) { errEl.textContent = 'Please fill in every field.'; return; }
      if (!app.isValidEmail(email)) { errEl.textContent = 'Enter a valid email address.'; return; }
      if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }

      btn.disabled = true; btn.textContent = 'Setting up…';
      try {
        const res = await fetch('/api/auth-signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ business, name, email, password })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { errEl.textContent = body.error || 'Could not create your account.'; return; }

        const supabase = await app.waitForSupabase();
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) { errEl.textContent = 'Account created — please sign in.'; location.href = '/admin/login.html'; return; }
        await app.loadUserContext();
        location.href = '/admin/settings.html?welcome=1';
      } catch (err) {
        console.error(err);
        errEl.textContent = 'Something went wrong. Please try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
