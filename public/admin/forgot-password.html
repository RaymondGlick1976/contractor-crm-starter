<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | YourCRM</title>
  <link rel="stylesheet" href="/css/styles.css?v=40">
  <link rel="stylesheet" href="/css/auth.css?v=1">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand"><span class="auth-brand-mark">Y</span> YourCRM</div>
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-sub">We'll email you a link to choose a new one.</p>
      <form id="form" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-input" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="submit-btn">Send reset link</button>
        <div class="auth-error" id="error"></div>
        <div class="auth-ok" id="ok" style="display:none;"></div>
      </form>
      <div class="auth-links"><a href="/admin/login.html">Back to sign in</a></div>
    </div>
  </div>
  <script src="/js/utils.js?v=40"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errEl = document.getElementById('error');
      const okEl = document.getElementById('ok');
      const btn = document.getElementById('submit-btn');
      errEl.textContent = ''; okEl.style.display = 'none';
      if (!app.isValidEmail(email)) { errEl.textContent = 'Enter a valid email address.'; return; }
      btn.disabled = true;
      try {
        await fetch('/api/auth-reset', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        okEl.textContent = 'If that email has an account, a reset link is on its way. Check your inbox.';
        okEl.style.display = 'block';
      } catch (err) {
        errEl.textContent = 'Could not send the link. Please try again.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
