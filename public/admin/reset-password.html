<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | YourCRM</title>
  <link rel="stylesheet" href="/css/styles.css?v=40">
  <link rel="stylesheet" href="/css/auth.css?v=1">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand"><span class="auth-brand-mark">Y</span> YourCRM</div>
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <p class="auth-sub" id="sub">Checking your reset link…</p>
      <form id="form" novalidate style="display:none;">
        <div class="auth-field">
          <label for="password">New password</label>
          <input type="password" id="password" class="form-input" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        </div>
        <div class="auth-field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" class="form-input" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="submit-btn">Save password</button>
      </form>
      <div class="auth-error" id="error"></div>
      <div class="auth-links"><a href="/admin/forgot-password.html">Request a new link</a></div>
    </div>
  </div>
  <script src="/js/utils.js?v=40"></script>
  <script>
    const errEl = document.getElementById('error');
    const form = document.getElementById('form');
    const sub = document.getElementById('sub');

    (async () => {
      const supabase = await app.waitForSupabase();
      const q = new URLSearchParams(location.search);
      if (q.get('token_hash')) {
        const { error } = await supabase.auth.verifyOtp({ token_hash: q.get('token_hash'), type: 'recovery' });
        if (error) { sub.textContent = 'This reset link is invalid or has expired.'; return; }
        history.replaceState(null, '', location.pathname);
      }
      let session = null;
      for (let i = 0; i < 20 && !session; i++) {
        ({ data: { session } } = await supabase.auth.getSession());
        if (!session) await new Promise(r => setTimeout(r, 150));
      }
      if (!session) {
        sub.textContent = 'This reset link is invalid or has expired.';
        return;
      }
      sub.textContent = 'Signed in as ' + session.user.email;
      form.style.display = 'block';
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
      if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        const supabase = await app.waitForSupabase();
        const { error } = await supabase.auth.updateUser({ password });
        if (error) { errEl.textContent = error.message; return; }
        const user = await app.loadUserContext();
        location.href = user ? '/admin/index.html' : '/admin/login.html?reset=1';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
